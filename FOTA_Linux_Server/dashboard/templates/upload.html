<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Firmware</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>
        <div class="title">OTA Management Dashboard</div>
        <div class="subtitle">Firmware Over-The-Air Control System</div>
    </div>
</div>

<div class="container">
    <div class="upload-box">

        <div class="page-header">
            <div class="title">Upload Firmware</div>
            <div class="subtitle">Upload HEX Firmware File</div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Target Configuration</div>
            </div>
            <div class="card-body" style="padding-top: 20px;">

                <form action="/upload" method="POST" enctype="multipart/form-data">

                    <div class="form-group">
                        <label>Target ECU</label>
                        <div class="select-wrap">
                            <select name="ecu">
                                {% for addr, name in ecus.items() %}
                                <option value="{{ addr }}">{{ addr }} — {{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Firmware Version</label>
                        <input type="text" name="version" placeholder="e.g. 1.3" required>
                    </div>

                    <div class="form-group">
                        <label>HEX File</label>
                        <input type="file" name="hex_file" accept=".hex, .bin" required>
                    </div>

                    <button class="button" type="submit">↑ Upload Firmware</button>

                </form>

            </div>
        </div>

        <a class="button button-ghost button-back" href="/">← Back to Dashboard</a>

        <div class="footer">OTA Embedded Project Dashboard</div>
    </div>
</div>

</body>
</html>
